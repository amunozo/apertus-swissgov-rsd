[project]
name = "swissgov-rsd"
version = "0.1.0"
description = "Hack Apertus 2026, UZH challenge: token-level semantic differences (SwissGov-RSD)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    # needed only by the official evaluation script
    "nlpstats",
    "jsonlines",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsd", "src/official_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
